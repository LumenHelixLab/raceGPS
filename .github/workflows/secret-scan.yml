name: secret-scan

on:
  push:
  pull_request:

jobs:
  basic-secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block obvious committed secrets
        shell: bash
        run: |
          # Scan tracked files, including this workflow, without printing secret values.
          # Match credential shapes rather than the expressions that define this check.
          status=0
          git grep -l -I -E \
            -e 'AIza[[:alnum:]_-]{35}' \
            -e 'CESIUM_ION_TOKEN[[:space:]]*=[[:space:]]*["'"'"']?[[:alnum:]_.-]{20,}' \
            -e '-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----' \
            -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Possible committed secrets found in the files listed above."
            exit 1
          elif [ "$status" -ne 1 ]; then
            exit "$status"
          fi
