name: UE5 Build & Package (operator gate)

# A public PR must not execute arbitrary code on the provisioned Unreal host.
# Portable checks run separately. Dispatch this gate on a reviewed branch.
on:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        options: [Development, Shipping]
        default: Development
        description: Build configuration

permissions:
  contents: read

jobs:
  ue5-build:
    runs-on: [self-hosted, Windows, X64, racegps, ue5-5.7]
    timeout-minutes: 180
    env:
      RACEGPS_UE_ROOT: ${{ vars.RACEGPS_UE_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build editor, game, cooked data and evidence
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "racegps-game-${{ github.run_id }}-${{ github.run_attempt }}"
          $evidencePath = Join-Path $env:RUNNER_TEMP "racegps-evidence-${{ github.run_id }}-${{ github.run_attempt }}/build.json"
          python scripts/build.py --config '${{ inputs.configuration }}' --archive $archivePath --report $evidencePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain build evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/racegps-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Retain packaged game (not a playability certificate)
        uses: actions/upload-artifact@v4
        with:
          name: racegps-Win64-${{ inputs.configuration }}-${{ github.sha }}
          path: ${{ runner.temp }}/racegps-game-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          compression-level: 0
